# Sprint 8.5：两块同质 base + 一块从像素核验四角语义的过渡 tile。
schema_version: "1.0"
asset_id: transition_tiles
asset_type: tileset
description: >-
  A cohesive top-down grass and dirt terrain family for a temperate forest map,
  sharing one muted natural palette.

style:
  perspective: top_down
  target_size: [32, 32]
  max_colors: 16
  shading: two_tone
  antialiasing: false

tileset:
  tile_size: [32, 32]
  tiles:
    - tile_id: grass_base
      description: >-
        Dense short green grass covering the whole square evenly with fine blades.
      terrain: grass
    - tile_id: dirt_base
      description: >-
        Packed brown forest dirt covering the whole square with fine gravel speckles.
      terrain: dirt
    - tile_id: grass_dirt_corner
      description: >-
        Grass changing into packed dirt across one soft irregular internal boundary.
      terrain:
        corners: [grass, grass, dirt, dirt]
      # 过渡块权重调高：均匀抽时 18% 的 seed 会铺出完全单材质的地图（过渡块可用
      # 却一次没用），提到 6.0 后降到 2%。权重只影响抽哪个候选，不会让非法接缝
      # 变合法，也改不了过渡带的宽度（那由邻接表结构决定）。详见 PLAN §8.7。
      weight: 6.0

export:
  targets: [generic-json]
